[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "A voice call that sends nothing while you are quiet"
license = "Unlicense"
repository = "https://github.com/isene/hush"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
audiopus = "0.2"
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
