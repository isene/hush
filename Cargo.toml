[package]
name = "hush"
version = "0.4.2"
edition = "2021"
description = "A voice call that sends nothing while you are quiet"
license = "Unlicense"
repository = "https://github.com/isene/hush"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
# The relay also answers browsers, which cannot send UDP. This is the
# WebSocket handshake and framing, and nothing else.
tungstenite = "0.24"
audiopus = { version = "0.2", optional = true }
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust", optional = true }
glow = { version = "0.1", path = "../glow", package = "fe2o3-glow", optional = true }
# The lock on the call. AES-GCM seals each packet, and PBKDF2 turns the
# room's name into the key. Both are in every browser too, so the web
# page does the same with no library at all.
aes-gcm = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# The caller needs Opus, a terminal library and the lock. The relay needs
# none of them, so a server can build it with nothing else installed.
default = ["caller"]
caller = ["dep:audiopus", "dep:crust", "dep:glow", "dep:aes-gcm", "dep:pbkdf2", "dep:hmac", "dep:sha2"]

[[bin]]
name = "hush"
path = "src/main.rs"
required-features = ["caller"]

[[bin]]
name = "hush-relay"
path = "src/bin/hush-relay.rs"

[lib]
name = "hush"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
