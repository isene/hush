name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hush-linux-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          path: hush

      - name: Checkout crust
        uses: actions/checkout@v4
        with:
          repository: isene/crust
          path: crust

      - name: Checkout glow
        uses: actions/checkout@v4
        with:
          repository: isene/glow
          path: glow

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Opus
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev

      - name: Build
        working-directory: hush
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build the relay on its own
        working-directory: hush
        run: cargo build --release --no-default-features --bin hush-relay --target ${{ matrix.target }}

      - name: Package
        working-directory: hush
        run: |
          cp target/${{ matrix.target }}/release/hush ../${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hush-relay ../hush-relay-linux-x86_64
          chmod +x ../${{ matrix.artifact }} ../hush-relay-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            hush-relay-linux-x86_64

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform:
            ```bash
            chmod +x hush-*
            ./hush-linux-x86_64 kitchen
            ```

            Optionally copy to your PATH:
            ```bash
            sudo cp hush-linux-x86_64 /usr/local/bin/hush
            ```

            ## What is in here
            - `hush-linux-x86_64` - the call itself (Linux, Intel/AMD 64-bit)
            - `hush-relay-linux-x86_64` - the relay, for a machine both ends can reach

            The call needs `libopus0`, `arecord` and `aplay`. The relay needs nothing.

      - name: Upload the binaries, one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload endpoint answers 500 when several files go up at once.
          for f in artifacts/*/*; do
            for try in 1 2 3; do
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "upload of $f failed; waiting 10 s"
              sleep 10
            done
          done
